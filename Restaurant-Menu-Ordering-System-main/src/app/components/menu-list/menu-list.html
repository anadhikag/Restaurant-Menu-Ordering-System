<h2>Restaurant Menu</h2>

<div class="search-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Menu</mat-label>
    <input matInput type="text" [(ngModel)]="searchText" placeholder="E.g. Pizza, Dessert">
  </mat-form-field>
</div>

<div class="menu-grid">
  <mat-card class="menu-card" *ngFor="let item of menuItems | filter:searchText" 
            [appHighlight]="item.recommended">
    
    <div *ngIf="item.recommended" class="badge">Recommended</div>
    <div *ngIf="item.discounted" class="badge discount">Discounted</div>

    <img mat-card-image [src]="item.imageUrl" alt="{{ item.name }}" />

    <mat-card-content>
      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>
      <!-- Use built-in currency pipe -->
      <h4>{{ item.price | currency:'INR':'symbol':'1.0-0' }}</h4>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="addToCart(item)">
        Add to Cart
      </button>

    </mat-card-actions>
  </mat-card>
</div>
